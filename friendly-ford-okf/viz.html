    "datasets/dealership": "# Friendly Ford\n\nFriendly Ford is a Ford dealership located at 2800 N Telegraph Rd, Monroe, MI 48162. It shares the Friendly Auto Group campus with Friendly Lincoln, operating under the combined \"Friendly Ford Lincoln\" brand. The dealership serves Monroe County and the greater Detroit-Toledo area.\n\n## Contact Information\n\n- **Sales**: (734) 243-6000\n- **Service**: (734) 240-5010\n- **Parts**: (734) 240-5020\n- **Website**: https://www.yourfriendlyford.com/\n\n## Location\n\n2800 N Telegraph Rd, Monroe, MI 48162\n\nGoogle place_id: `ChIJHXiveTFvO4gR6Pak6d1TQo0`\n\n## Service Area\n\nMonroe County and nearby Wayne County communities including Monroe, Riverview, Trenton, and Woodhaven, Michigan.\n\n## About\n\nFriendly Ford's mission is to be \"the automotive home of drivers in the Monroe MI area.\" The dealership's tagline is \"Friendly - It's not just a name, it's the way we do business!\" It is led by President Tom Shankie and Dealer Principal & General Manager Nicole Ernst.\n\n## Departments and Features\n\n- **Sales** - New and pre-owned Ford cars, trucks, and SUVs\n- **Service Center** - \"Service Your Way\" with in-person service, mobile service, and pickup & delivery\n- **Collision Center** - Full body shop at (734) 243-6900\n- **Parts Center** - Genuine Ford parts\n- **Finance Center** - No-hassle financing and leasing\n- **EV & Hybrid** - Electric and hybrid vehicle inventory\n\n## Service Amenities\n\nFree coffee and Wi-Fi, loaner vehicles, local shuttle service, and a free car wash with service.\n\nSee [new-vehicles.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/friendly-ford/datasets/new-vehicles.md) for the Ford lineup.\nSee [service-center.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/friendly-ford/datasets/service-center.md) for service offerings.",

    "datasets/financing": "# Friendly Ford Financing\n\nFriendly Ford's finance center offers no-hassle financing and leasing for new and pre-owned Ford vehicles, with plans designed around the customer's lifestyle and budget.\n\n## Finance Tools\n\n- Online financing application (`/financing/index.htm`)\n- Kelley Blue Book Instant Cash Offer trade-in valuation\n- Payment calculators\n\n## Current Offers\n\n- **Select Ford Bronco** - 7.3% APR for 60 months.\n- **Select Ford Maverick** - $1,000 cash back and 7.3% APR for 60 months; or $3,000 cash back and 6.7% APR for 62 months.\n- **Select Ford Explorer** - $1,000 cash back and 0.0% APR for 38 months.\n- **2026 F-150 SuperCrew 4x4 2.7L (Pkg 302A)** - Lease for $449/mo for 24 months (everyone), or $329/mo with A/Z Plan.\n- **2026 Explorer 2.3L 4WD (Pkg 200A)** - Lease for $439/mo for 24 months (everyone), or $369/mo with A/Z Plan.\n- **2026 F-150 XLT Gas** - Up to $4,000 in factory rebates plus up to $1,750 conditional trade assist.\n\nSee [new-vehicles.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/friendly-ford/datasets/new-vehicles.md) for offer details by model.",
    "datasets/new-vehicles": "# Friendly Ford New Vehicles\n\nFriendly Ford sells the full Ford lineup with an emphasis on trucks and commercial vehicles. The homepage organizes models by body style: Convertible, SUV, Truck, Van, and Wagon.\n\n## New Ford Lineup\n\n| Category | Models |\n|---|---|\n| SUV | Bronco, Bronco Sport, Expedition Max, Explorer, Mustang Mach-E |\n| Truck | F-150, Super Duty (F-250/F-350/F-450/F-550/F-600), Ranger, Maverick |\n| Van | Transit (150/250/350) |\n| Wagon | Expedition, Explorer |\n| Convertible | Mustang |\n\n## EV & Hybrid\n\nThe dealership maintains a dedicated EV & Hybrid navigation section for models such as the Mustang Mach-E and F-150 Lightning.\n\n## Current New Vehicle Offers\n\n- **Select Ford Bronco** - 7.3% APR for 60 months.\n- **Select Ford Maverick** - $1,000 cash back and 7.3% APR for 60 months.\n- **Select Ford Explorer** - $1,000 cash back and 0.0% APR for 38 months.\n- **2026 F-150 XLT Gas** - Up to $4,000 in factory rebates plus up to $1,750 conditional trade assist.\n\nSee [model-comparison.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/friendly-ford/tables/model-comparison.md) for a lineup comparison.\nSee [financing.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/friendly-ford/datasets/financing.md) for finance and lease details.",
    "datasets/service-center": "# Friendly Ford Service Center\n\nFriendly Ford operates a full service center at 2800 N Telegraph Rd, Monroe, MI, under a \"Service Your Way\" model offering three service options.\n\n## Service Your Way\n\n- **In-Person Service** - Traditional service appointments\n- **Mobile Service** - Technicians dispatched to the customer's home or office\n- **Pick-Up & Delivery** - Vehicle pickup and delivery\n\n## Service Amenities\n\n- Free coffee and Wi-Fi\n- Loaner vehicles\n- Local shuttle service\n- Free car wash with service\n- Factory-trained technicians and OEM parts\n\n## Collision Center\n\nA dedicated collision center provides body shop services at (734) 243-6900, staffed by a Collision Center Manager, technicians, a painter, and an estimator.\n\nSee [staff.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/friendly-ford/datasets/staff.md) for the service department roster.\nSee [hours.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/friendly-ford/tables/hours.md) for service hours.",

- **Craig Rumberger** - Porter (734) 590-5804",
    "datasets/used-vehicles": "# Friendly Ford Used Vehicles\n\nFriendly Ford offers pre-owned and certified pre-owned Ford vehicles alongside its new inventory. The dealership keeps a stock of used cars, trucks, and SUVs at competitive prices.\n\n## Trade-In\n\nFriendly Ford offers a fast trade-in value tool powered by Kelley Blue Book Instant Cash Offer, letting customers get an accurate value for their vehicle today and apply it toward a purchase.\n\n## Buying Tools\n\n- Value Your Trade (Kelley Blue Book Instant Cash Offer)\n- No-hassle financing and lease options\n- Pre-owned specials\n\nSee [financing.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/friendly-ford/datasets/financing.md) for pre-owned financing options.",
    "references/ai-discovery-page": "# Friendly Ford AI Discovery\n\nFriendly Ford (Monroe, MI) is associated with the PromptGraph slug `friendly-ford`. The sitemap at `https://api.promptgraph.ai/api/v1/friendly-ford/sitemap.xml` enumerates the available endpoints.\n\n## Endpoints\n\n| Endpoint | Status | Notes |\n|---|---|---|\n| `/business` | Populated | AutoDealer JSON-LD with address, phone, hours, rating |\n| `/prompts` | Populated | 15 featured Monroe MI prompts |\n| `/offers` | Populated | 8 Ford program offers |\n| `/vehicles` | Populated | 134 vehicles, paginated (20 per page) |\n| `/testimonials` | Empty | Returns empty array |\n| `/gbp-context` | Populated | 4.5/5 rating, 1,201 reviews, 5 recent reviews |\n| `/.well-known/ai-manifest.json` | Populated | Machine-readable resource directory |\n| `/robots.txt` | Populated | Allows all AI bots |\n| `/llms.txt` | Populated | LLMForge v1.0 directive |\n\n## robots.txt Policy\n\nThe robots.txt allows all user agents and explicitly allows GPTBot, Claude-Web, GoogleOther, PerplexityBot, anthropic-ai, Grok-Bot, and Applebot.\n\n## Data Note\n\nThe `/vehicles` endpoint reports 134 total vehicles, but its crawl metadata references `friendlyford.com` (a different, unrelated Friendly Ford dealership in Roselle, IL) rather than the Monroe site `yourfriendlyford.com`. Inventory counts should therefore be treated with caution.\n\nSee [llms-txt.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/friendly-ford/references/llms-txt.md) for the LLMForge directive.\nSee [prompts.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/friendly-ford/references/prompts.md) for the prompt library.",
    "references/llms-txt": "# Friendly Ford llms.txt\n\nFriendly Ford publishes an llms.txt directive in LLMForge v1.0 format, last updated 2026-08-17.\n\n## Discovery\n\n- Primary discovery endpoint: `/.well-known/ai-manifest.json`\n- Format: JSON-LD following Schema.org standards\n- API base: `https://api.promptgraph.ai/api/v1/friendly-ford`\n\n## Documented Endpoints\n\n- **Business Information** (`/business`) - Address, contact, hours, location\n- **Vehicle Inventory** (`/vehicles`) - Specifications, pricing, availability\n- **Prompts & FAQs** (`/prompts`) - Structured prompts for consistent AI responses\n- **Customer Testimonials** (`/testimonials`) - Reviews and ratings\n- **Google Business Profile Context** (`/gbp-context`) - Flattened GBP data\n- **Full Site JSON Mirror** (`/site-content`) - Plain-text mirror of the site\n- **AI Manifest** (`/.well-known/ai-manifest.json`) - Resource directory\n- **Sitemap** (`/sitemap.xml`) - XML sitemap\n- **Configuration** (`/config.json`) - System configuration\n\n## Schema Types\n\nLocalBusiness / AutoDealer, Car, ItemList, Review / AggregateRating, Offer, CreativeWork.",
    "references/prompts": "# Friendly Ford Prompts\n\nPromptGraph serves a prompt library for Friendly Ford. Fifteen featured prompts are surfaced in the sitemap and llms.txt.\n\n## Featured Prompts\n\n1. **Friendly Ford Dealer Monroe MI** - Customer-focused dealership with transparent pricing and easy financing.\n2. **New Ford Trucks Monroe MI** - F-150 and Ranger trucks with towing capability and specials.\n3. **Used Ford Cars SUVs Monroe** - Quality used inventory with inspections and warranties.\n4. **Ford Financing Monroe MI** - Flexible financing and leasing with online applications.\n5. **Ford Service Monroe MI** - Factory-trained technicians, oil changes, and free car washes.\n6. **Ford F-150 Dealer Monroe** - New and used F-150 trucks with expert advice.\n7. **Certified Pre-Owned Ford Monroe** - Rigorous inspections and warranties.\n8. **Ford Explorer SUVs Monroe MI** - New and used Explorer options.\n9. **Ford Mustang Mach-E Electric Monroe** - Electric vehicle guidance and incentives.\n10. **Ford Lease Deals Monroe MI** - Low monthly payments and lease specials.\n11. **Trade-In Value Monroe Ford Dealer** - Kelley Blue Book instant offers and appraisals.\n12. **Ford Parts Monroe MI** - Genuine Ford parts and accessories.\n13. **Ford Service Specials Monroe** - Oil change, brake, and tire service coupons.\n14. **New Ford Inventory Monroe MI** - Searchable new inventory with specials.\n15. **Used Ford Deals Monroe MI** - Competitive used pricing with financing.\n\n## Structure\n\nEach prompt includes a title, a description (the model instruction), and an example response.",
    "references/testimonials": "# Friendly Ford Testimonials\n\nFriendly Ford holds a 4.5 out of 5 Google rating across 1,201 reviews. The PromptGraph `/testimonials` endpoint returns an empty array, so review data was sourced from the Google Business Profile context endpoint.\n\n## Aggregate Rating\n\n- **Rating**: 4.5 / 5\n- **Review count**: 1,201\n- **place_id**: ChIJHXiveTFvO4gR6Pak6d1TQo0\n\n## Recent Reviews\n\n| Author | Rating | Summary |\n|---|---|---|\n| Bobbie Jones | 5 | \"I had a great experience with Friendly Ford and my salesperson, Blaine. The pricing on the internet was the same price I received when I went in...\" (2026-02) |\n| Kelli Magill | 5 | \"Found a great used truck here at Friendly Ford! ... We dealt with Carlo Grassi and he was an absolute pleasure to deal with.\" (2026-02) |\n| Mariah Bray | 5 | \"Took my car in for a break repair, they caught a broken fly wheel for me... My work also came with a 2 year warranty.\" (2026-05) |\n| Kristina Yates | 5 | \"I needed an oil change... I was able to call and get a same day appointment. I was in and out within an hour.\" (2026-01) |\n| Phillip Gere | 4 | \"Nick Sherman walked over and offered to help me... went over everything for my lease in great detail.\" (2026-01) |\n\n## Themes\n\nReviewers consistently praise the sales staff by name (Blaine, Nick Sherman, Carlo Grassi) for transparent pricing and attentive service, and the service department for thorough diagnostics and fast turnaround.",
    "tables/contact": "# Friendly Ford Contact\n\n## Address\n\n2800 N Telegraph Rd\nMonroe, MI 48162\n\n## Phone Numbers\n\n| Department | Phone |\n|---|---|\n| Sales | (734) 243-6000 |\n| Service | (734) 240-5010 |\n| Parts | (734) 240-5020 |\n\nAdditional department lines listed on the about page: Sales (734) 415-2080, Service (734) 590-5804, Parts (734) 590-5803.\n\n## Online\n\n- **Website**: https://www.yourfriendlyford.com/\n- **Directions**: /dealership/directions.htm\n- **Schedule Service**: /service-appointment.htm\n- **Mobile Service**: /mobileservice.htm\n- **Financing**: /financing/index.htm\n\n## Social Media\n\n- Facebook: @friendlyfordmonroe\n- Instagram: @friendlyfordlincoln\n- YouTube: Friendly Ford Lincoln channel\n\n## Google Business Profile\n\n- place_id: `ChIJHXiveTFvO4gR6Pak6d1TQo0`\n- Rating: 4.5 / 5 (1,201 reviews)",
    "tables/hours": "# Friendly Ford Hours\n\nFriendly Ford operates on a Monday through Saturday schedule, closed on Sundays.\n\n| Day | Sales | Service | Parts |\n|---|---|---|---|\n| Monday | 9am-6pm | 9am-6pm | 9am-6pm |\n| Tuesday | 9am-6pm | 9am-6pm | 9am-6pm |\n| Wednesday | 9am-6pm | 9am-6pm | 9am-6pm |\n| Thursday | 9am-6pm | 9am-6pm | 9am-6pm |\n| Friday | 9am-6pm | 9am-6pm | 9am-6pm |\n| Saturday | 9am-1pm | 9am-1pm | 9am-1pm |\n| Sunday | Closed | Closed | Closed |",
    "tables/model-comparison": "# Ford Model Comparison\n\nThe Ford lineup sold at Friendly Ford spans compact crossovers to heavy-duty commercial trucks, with electric options.\n\n| Model | Segment | Body Style | Powertrain Options |\n|---|---|---|---|\n| Maverick | Compact pickup | Truck | Gasoline, Hybrid |\n| Ranger | Mid-size pickup | Truck | Gasoline |\n| F-150 | Full-size pickup | Truck | Gasoline, Hybrid, Electric (Lightning) |\n| F-150 Lightning | Full-size electric pickup | Truck | Electric |\n| Super Duty (F-250/F-350/F-450/F-550/F-600) | Heavy-duty pickup | Truck | Gasoline, Diesel |\n| Transit (150/250/350) | Commercial van | Van | Gasoline |\n| Bronco Sport | Compact off-road SUV | SUV | Gasoline |\n| Bronco | Mid-size off-road SUV | SUV | Gasoline |\n| Escape | Compact SUV | SUV | Gasoline, Hybrid |\n| Explorer | Mid-size three-row SUV | SUV | Gasoline, Hybrid |\n| Expedition / Expedition Max | Full-size SUV | SUV | Gasoline |\n| Mustang Mach-E | Electric crossover | SUV | Electric |\n| Mustang | Sports car | Convertible/Coupe | Gasoline |\n\n## Notes\n\n- The F-150 Lightning and Mustang Mach-E represent Ford's electric lineup.\n- Super Duty and Transit models support Friendly Ford's commercial and work truck focus.\n- The Mustang is the lone convertible/coupe in the lineup.\n\nSee [new-vehicles.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/friendly-ford/datasets/new-vehicles.md) for current offers by model."

</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} - OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      { selector: "node", style: { "background-color": "data(color)", "label": "data(label)", "color": "#0f172a", "font-size": 11, "text-valign": "bottom", "text-margin-y": 4, "text-wrap": "wrap", "text-max-width": 120, "width": "data(size)", "height": "data(size)", "border-width": 1, "border-color": "#0f172a" } },
      { selector: "node:selected", style: { "border-width": 3, "border-color": "#f59e0b" } },
      { selector: "edge", style: { "width": 1.5, "line-color": "#cbd5e1", "target-arrow-color": "#cbd5e1", "target-arrow-shape": "triangle", "curve-style": "bezier", "arrow-scale": 0.9 } },
      { selector: "edge:selected", style: { "line-color": "#f59e0b", "target-arrow-color": "#f59e0b", "width": 2.5 } },
      { selector: ".dim", style: { "opacity": 0.15 } },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => { if (evt.target === cy) clearSelection(); });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) { cy.elements().removeClass("dim"); return; }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay = (d.label || "").toLowerCase() + " " + d.id.toLowerCase() + " " + (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) { cy.elements().removeClass("dim"); return; }
    cy.nodes().forEach((n) => { n.toggleClass("dim", n.data("type") !== t); });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    document.getElementById("detail").scrollTop = 0;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "-";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "-";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "-";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl, conceptId);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = (nodeIndex[src]?.label || src).replace(/—/g, '-');
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }
  }

  function rewriteInternalLinks(root, sourceConceptId) {
    const sourceDir = sourceConceptId ? sourceConceptId.substring(0, sourceConceptId.lastIndexOf("/")) : "";
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.endsWith(".md") && !href.startsWith("http")) {
        let target = href.startsWith("/") ? href.slice(1) : href;
        target = target.slice(0, -3);
        if (!nodeIndex[target] && sourceDir && !target.includes("/")) {
          target = sourceDir + "/" + target;
        }
        if (nodeIndex[target]) {
          a.className = "internal";
          a.textContent = nodeIndex[target].label.replace(/—/g, '-');
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => { e.preventDefault(); showDetail(target); });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  const initial = bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();
</script>
