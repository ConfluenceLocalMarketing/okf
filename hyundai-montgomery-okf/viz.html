: What service specials are currently available?**\nA: 15% OFF battery special with free installation and charging system check, FREE brake inspection, and a vehicle service special saving $10-$40 on service purchases. All valid to 10/06/2026.\n\n**Q: Can I wait at the dealership during service?**\nA: Yes, the waiting area features comfortable seating, free Wi-Fi, coffee, and snacks.\n\n## Dealership\n\n**Q: Where is Hyundai Montgomery located?**\nA: 4701 Carmichael Rd., Montgomery, AL 36106, serving the River Region including Prattville, Auburn, Selma, Wetumpka, Pike Road, and Millbrook.\n\n**Q: How long has the dealership been in business?**\nA: The family-owned business has served the area since 1970.\n\n**Q: What is the dealership's rating?**\nA: 4.4 / 5.0 from 3,545 Google reviews.\n\n**Q: Does the dealership offer online car buying?**\nA: Yes, an Express Store (shopnow.hyundaimontgomery.com) supports online vehicle purchasing, and the dealership offers vehicle delivery and online appointment scheduling.\n\nSee [prompts.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/hyundai-montgomery/references/prompts.md) for the complete prompt library with detailed Q&A pairs.",
    "datasets/financing": "# Financing & Leasing - Hyundai Montgomery\n\nThe Hyundai Montgomery Finance Center offers purchase financing and lease programs for new and pre-owned vehicles.\n\n## Financing Options\n\n- **Online Application** - Secure online credit application at /finance/apply-for-financing/\n- **Multiple Lending Partners** - The finance team works with many lenders to find competitive interest rates for every buyer\n- **Flexible Terms** - Loan and lease solutions for different ownership goals and budgets\n- **Customizable Terms** - Various lease options and purchase terms\n- **Competitive APR Specials** - Manufacturer incentives through Hyundai Motor Finance\n\n## Current Financing Specials (expire 08/31/2026)\n\n| Model | APR Offer | Term |\n|---|---|---|\n| 2026 Santa Fe | 0% APR | 60 months |\n| 2026 Santa Fe Hybrid | 0% APR | 60 months |\n| 2026 Tucson | 0% APR | 60 months |\n| 2026 IONIQ 5 | 0% APR | 72 months |\n| 2026 IONIQ 9 | 0% APR | 72 months |\n| 2026 Sonata | 0.99% APR | 60 months |\n| 2026 Elantra | 3.49% APR | 60 months |\n| 2026 Kona | 3.49% APR | 60 months |\n| 2026 Palisade | 3.99% APR | 60 months |\n\nAPR offers require approval and financing through Hyundai Motor Finance. Not all buyers qualify.\n\n## Leasing\n\nLeasing is available for customers who prefer lower monthly payments and the option to drive a new vehicle every few years. New vehicle lease deals include the 2026 Tucson.\n\n## Buying vs. Leasing\n\n| Factor | Buying | Leasing |\n|---|---|---|\n| Monthly Payment | Higher | Lower |\n| Ownership | Own the vehicle at end of term | Return vehicle at end of term |\n| Mileage | Unlimited | Limited by contract |\n| Sales Tax | Paid upfront or rolled into loan | Included in monthly payment |\n\n## Trade-In\n\n- **Value Your Trade** - Online valuation tool at /value-your-trade/\n- **Sell Your Car** - Cash offers for vehicles without a required purchase\n- **In-person appraisal** available at the dealership\n\n## Payment Calculators\n\nEstimate monthly payments using the online car payment calculator at /payment-calculator/.\n\n## Contact\n\nContact the finance team at (334) 851-8100 or through the dealership contact page.\n\nSee [dealership.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/hyundai-montgomery/datasets/dealership.md) for full business profile and [new-vehicles.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/hyundai-montgomery/datasets/new-vehicles.md) or [used-vehicles.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/hyundai-montgomery/datasets/used-vehicles.md) for inventory.",
    "datasets/new-vehicles": "# New Hyundai Models - Hyundai Montgomery\n\nHyundai Montgomery carries a full lineup of new Hyundai vehicles. The dealership website listed 1,061 new Hyundai vehicles in Montgomery, AL with prices ranging from $21,500 to $79,760.\n\n## Pricing Model\n\n- **UP FRONT pricing** - Transparent online pricing, no hidden fees\n- **Hyundai Rewards** - Tiered savings program offering additional discounts (Gold / Blue tiers)\n\n## SUVs & Crossovers\n\n### Hyundai Venue\nSubcompact SUV, Hyundai's most affordable model. Fuel-efficient and city-friendly.\n\n### Hyundai Kona\nSubcompact crossover SUV available in multiple trims.\n\n### Hyundai Tucson\nCompact SUV, Hyundai's best-selling model. Features bold design, available AWD, and advanced safety technology. Available with lease deals.\n\n### Hyundai Santa Fe\nMid-size SUV with modern design. Available in gasoline and **Santa Fe Hybrid** variants.\n\n### Hyundai Palisade\nFull-size 3-row SUV for families. Available in multiple trims.\n\n### Hyundai IONIQ 5\nAll-electric compact crossover with 800V ultra-fast charging capability.\n\n### Hyundai IONIQ 9\nAll-electric 3-row flagship SUV, the largest of the IONIQ electric family.\n\n## Cars\n\n### Hyundai Elantra\nCompact sedan, affordable and fuel-efficient. Available in multiple trims.\n\n### Hyundai Sonata\nMid-size sedan with sleek design and advanced safety features.\n\n## Trucks\n\n### Hyundai Santa Cruz\nCompact pickup truck (Sport Adventure Vehicle) combining SUV comfort with truck utility.\n\n## Electric & Hybrid Vehicles\n\n| Model | Type | Notes |\n|---|---|---|\n| **IONIQ 5** | Full EV | 800V fast charging, available e-AWD |\n| **IONIQ 6** | Full EV Sedan | Aerodynamic streamliner design |\n| **IONIQ 9** | Full EV 3-Row SUV | Flagship electric SUV |\n| **Santa Fe Hybrid** | Hybrid SUV | Efficient mid-size SUV |\n\n## Hyundai Safety & Technology\n\nMost new Hyundai models include:\n- **Hyundai SmartSense** - Advanced driver assistance suite\n- **Forward Collision-Avoidance Assist**\n- **Blind-Spot Collision-Avoidance Assist**\n- **Lane Keeping Assist**\n- **Safe Exit Assist**\n- **Rear Cross-Traffic Collision-Avoidance Assist**\n- **Smart Cruise Control**\n- **Bluelink Connected Services** - Remote start, lock/unlock, vehicle monitoring\n\n## Complimentary Maintenance\n\nNew 2020-2025 Hyundai model years include **Hyundai Complimentary Maintenance** for 3 years, covering oil changes, tire rotations, and multi-point inspections.\n\n## Specials\n\nCurrent new vehicle specials include 0% APR financing on selected models (2026 Santa Fe, Santa Fe Hybrid, Tucson) and 0% APR for 72 months on the IONIQ 5 and IONIQ 9, with all offers expiring 08/31/2026.\n\nSee [dealership.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/hyundai-montgomery/datasets/dealership.md) for contact information and current programs.\nSee [model-comparison.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/hyundai-montgomery/tables/model-comparison.md) for side-by-side model specifications.",
    "datasets/service-center": "# Service Center - Hyundai Montgomery\n\nThe Hyundai Montgomery Service Center provides certified maintenance and repair services at 4701 Carmichael Rd., Montgomery, AL.\n\n## Service Capabilities\n\n- **Routine Maintenance** - Oil changes, tire rotations, alignments, brake inspections\n- **Diagnostics** - Check engine light diagnosis, computerized system analysis\n- **Major Repairs** - Transmission service, engine repair, suspension work\n- **Battery Service** - Battery replacement with charging system check\n- **Brake Service** - Brake pad/shoe inspection, rotor/drum checks, brake fluid service\n- **Recall Repairs** - OEM-specified recall and campaign work (view at autoservice.hyundaiusa.com)\n- **Factory-Scheduled Maintenance** - Following Hyundai's recommended maintenance schedule\n\n## Service Team\n\n- **Factory-trained technicians** - Certified experts on maintaining your Hyundai to factory standards\n- **Certified service advisors** - Diagnose and communicate repair needs\n- **Nick Harris** - Service representative praised for updates and maintenance recommendations\n\n## Service Experience\n\n- **Online scheduling** available through the dealership website\n- **Genuine OEM parts** - Perfect fit and long-lasting performance\n- **State-of-the-art equipment** and diagnostic tools\n- **Comfortable waiting area** with seating, free Wi-Fi, coffee, and snacks\n- **Clean facilities** - Clean and sanitary restrooms\n- **Exceptional service** - Goal of getting you back on the road with your Hyundai running its best\n\n## Service Hours\n\n| Day | Hours |\n|---|---|\n| Monday | 7:30 AM - 6:00 PM |\n| Tuesday | 7:30 AM - 6:00 PM |\n| Wednesday | 7:30 AM - 6:00 PM |\n| Thursday | 7:30 AM - 6:00 PM |\n| Friday | 7:30 AM - 6:00 PM |\n| Saturday | 8:00 AM - 2:00 PM |\n| Sunday | Closed |\n\n## Parts Department\n\n- **Genuine Hyundai OEM parts** - Brake pads, discs, suspension components, and more\n- Tires and wheels\n- Accessories for Hyundai     "datasets/staff": "# Staff Directory - Hyundai Montgomery\n\nStaff directory compiled from the dealership website and customer reviews. The dealership does not publish an individual staff directory page; staff members are identified from customer reviews on Google and DealerRater.\n\n## Sales Consultants\n\n- **Kameron** - Praised for smooth, fun car buying process\n- **Michelle** - Professional salesperson; went above and beyond to find the right model and color\n- **Spencer Gilcrease** - Excellent at explaining vehicles; knowledgeable and helpful through the entire process\n- **Nick Harris** - Sales advisor; notified customers of service progress and maintenance recommendations\n- **Fred** - Attentive, responsive, transparent, and patient\n- **Jamal** - Very responsive and customer oriented\n- **Raul Altamira** - Helped customers into the right car; quick, efficient, easy process\n- **Zolan (Zoland Armstrong)** - Great to work with on new purchases\n- **Randy Dunn** - Made decision making smoother than expected; answered every question\n- **Nicoy** - Made a phone call and located the exact vehicle requested\n- **Jalen** - Exceptional salesman; timely process\n- **Jarvis (Jarkis)** - Knowledgeable about vehicles and features; very helpful\n- **David (David Neal)** - Patient, helpful, knew a lot about the vehicles\n- **Nicholas** - Wonderful salesperson\n- **Marcus** - Made the process easier\n- **Tusan** - Patient; went on several test drives before finding the right vehicle\n- **LC** - Made the process smooth\n\n## Finance Team\n\n- **Andrew** - Finance Manager; professional (mentioned in customer review)\n\n## Service Department\n\n- **Nick Harris** - Service representative; great at updates, let customers know what maintenance may be needed\n\n## Contact\n\n- **Sales:** (334) 851-8100\n- **Service:** (334) 851-8100\n- **Parts:** (334) 851-8100\n\nSee [testimonials.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/hyundai-montgomery/references/testimonials.md) for detailed customer reviews referencing specific staff members.",
    "datasets/used-vehicles": "# Used Cars, Trucks & SUVs - Hyundai Montgomery\n\nHyundai Montgomery is a used car headquarters with one of the largest selections of pre-owned vehicles in the area. The dealership website listed 319 used and certified used vehicles in Montgomery, AL.\n\n## Inventory Scope\n\n- **Total vehicles:** 319 used and certified used vehicles\n- **Multi-make selection** including Hyundai, Jeep, Ford, Toyota, Buick, Cadillac, Audi, BMW, Ram, Nissan, Honda, Volkswagen, and Mercedes-Benz\n- **Vehicle types:** Sedans, SUVs, trucks, and crossovers\n- **Hyundai models:** Popular sedans like the Elantra and Sonata, plus SUVs like the Tucson, Palisade, and Kona\n\n## Quality Assurance\n\n- **Vetting process** - Every used vehicle must meet or exceed dealership quality standards before earning a place in inventory\n- **Hyundai Certified Pre-Owned (CPO)** - Certified used vehicles with warranty coverage\n- **Carfax History Reports** - Available on request\n\n## Popular Used Models\n\n- **Hyundai** - Elantra, Sonata, Tucson, Palisade, Kona\n- **Jeep** - Wrangler, Cherokee, Grand Cherokee\n- **Ford** - Bronco Sport\n- **Toyota** - Tacoma, 4Runner\n- **Premium** - Buick, Cadillac, Audi, BMW\n- **Additional makes** - Ram, Nissan, Honda, Volkswagen, Mercedes-Benz\n\n## Shopping Experience\n\n- **Relationship-focused sales** - Team prioritizes relationships over sales and commissions\n- **Transparent and no-pressure** approach\n- **Test drives** available at the dealership\n\n## Online Buying Tools\n\n- Online inventory browsing and filtering\n- Value Your Trade tool (Sell Your Car)\n- Car payment calculator\n- Online credit application and pre-approval\n\n## Trade-In\n\n- Trade-in valuation tool available online and in person\n- Sell Your Car program - cash offers without a required purchase\n\nSee [dealership.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/hyundai-montgomery/datasets/dealership.md) for current financing and trade-in programs.",

    "references/llms-txt": "# LLMs.txt - Hyundai Montgomery\n\nThe `llms.txt` file provides a structured directive for LLMs and AI agents interacting with Hyundai Montgomery's web properties. It indexes key pages and structured API endpoints.\n\n## Site Pages\n\n### Main Site\n\n- [Hyundai Montgomery Home](https://www.hyundaimontgomery.com/) - New and used Hyundai vehicles in Montgomery, AL.\n- [New Vehicles](https://www.hyundaimontgomery.com/new-vehicles/) - Browse new Hyundai inventory.\n- [Used Inventory](https://www.hyundaimontgomery.com/used-inventory/) - Browse used cars, trucks, and SUVs.\n- [Finance](https://www.hyundaimontgomery.com/finance/) - Financing and lease options.\n- [Online Credit Application](https://www.hyundaimontgomery.com/finance/apply-for-financing/) - Apply for credit online.\n- [Service](https://www.hyundaimontgomery.com/service/) - Schedule an appointment for auto repair or regular maintenance.\n- [Parts](https://www.hyundaimontgomery.com/parts/) - Genuine Hyundai parts and accessories.\n- [Service Specials](https://www.hyundaimontgomery.com/service/service-specials/) - Current service offers.\n- [New Vehicle Specials](https://www.hyundaimontgomery.com/new-vehicles/new-vehicle-specials/) - Current Hyundai offers and incentives.\n- [About Us](https://www.hyundaimontgomery.com/about-us/) - Dealership history and team.\n- [Contact Us](https://www.hyundaimontgomery.com/contact-us/) - Contact form and dealer info.\n- [Value Your Trade](https://www.hyundaimontgomery.com/value-your-trade/) - Trade-in valuation.\n- [Payment Calculator](https://www.hyundaimontgomery.com/payment-calculator/) - Estimate monthly payments.\n- [Express Store](https://shopnow.hyundaimontgomery.com/inventory) - Online vehicle purchase platform.\n\n### AI & LLM Resources\n\n- [LLMs.txt](https://api.promptgraph.ai/api/v1/hyundai-montgomery/llms.txt) - Structured directive for LLMs and AI agents\n\n### Social Media\n\n- [Facebook](https://www.facebook.com/HyundaiMontgomery/     "references/prompts": "# PromptGraph Prompt Library - Hyundai Montgomery\n\nThe PromptGraph API at `https://api.promptgraph.ai/api/v1/hyundai-montgomery/prompts` exposes 20 structured Q&A prompt/response pairs. Below is a categorized summary.\n\n## Prompt Categories\n\n### Vehicle Shopping & Models (10+ prompts)\n- Hyundai Venue Crossover Sales - affordable new Venue near Montgomery\n- Hyundai IONIQ 6 Electric Sedan - all-electric streamliner near Prattville\n- Hyundai Kona Compact SUV - selection near Auburn\n- Hyundai Sonata Midsize Sedan - new Sonata near Selma\n- Hyundai Santa Cruz Truck - sport adventure pickup near Pike Road\n- Hyundai Elantra Sedan Sales - affordable Elantra near Wetumpka\n- Hyundai IONIQ 5 EV Deals - all-electric IONIQ 5 in the area\n- Hyundai Santa Fe Inventory - test drive and buy near Millbrook\n- Hyundai Palisade 3-Row SUV - family SUV near Prattville\n- New Hyundai Tucson Deals - best lease deals near Montgomery\n\n### Used Vehicles (3 prompts)\n- Used SUV Inventory Montgomery - reliable used Tucson and Santa Fe SUVs in the River Region\n- Affordable Used Cars Under 20k - trustworthy used Hyundais under $20,000\n- Certified Pre-Owned Hyundai - CPO cars and SUVs with warranty coverage\n\n### Financing (3 prompts)\n- Auto Loan Pre-Approval - pre-approval in Central Alabama\n- Flexible Auto Financing Options - low APR specials in Montgomery\n- Trade-In Valuation Montgomery - top dollar for trade-ins\n\n### Dealership & Reputation (2 prompts)\n- Top Hyundai Dealer Reputation - best dealership with high customer ratings\n- Hyundai Sales Events & Rebates - promotional cash incentives in Montgomery County\n\n### Buying Experience (2 prompts)\n- Sell Vehicle For Cash - sell a used car for cash without buying\n- Online Car Buying & Delivery - online buying and home delivery in Montgomery\n\n## Complete Prompt List\n\n| # | Position | Prompt Slug | Focus |\n|---|---|---|---|\n| 1 | 1 | `hyundai-venue-crossover-sales` | Venue availability |\n|     "tables/model-comparison": "# Hyundai Model Lineup Comparison - Hyundai Montgomery\n\n## Model Overview\n\n| Model | Body Type | Passengers | Drivetrain | Key Trims |\n|---|---|---|---|---|\n| **Venue** | Subcompact SUV | 5 | FWD | SE, SEL, Denim |\n| **Elantra** | Compact Sedan | 5 | FWD | SE, SEL, N Line, Limited |\n| **Sonata** | Mid-size Sedan | 5 | FWD | SE, SEL, N Line, Limited |\n| **Kona** | Subcompact Crossover | 5 | FWD / AWD | SE, SEL, N Line, Limited |\n| **Tucson** | Compact SUV | 5 | FWD / AWD | SE, SEL, XRT, N Line, Limited |\n| **Santa Fe** | Mid-size SUV | 5-7 | FWD / AWD | SE, SEL, XRT, Limited, Calligraphy |\n| **Santa Fe Hybrid** | Mid-size Hybrid SUV | 5-7 | AWD | SEL, Limited, Calligraphy |\n| **Palisade** | Full-size 3-Row SUV | 7-8 | FWD / AWD | SE, SEL, XRT, Limited, Calligraphy |\n| **Santa Cruz** | Compact Pickup (SAV) | 5 | FWD / AWD | SE, SEL, Night, XRT, Limited |\n| **IONIQ 5** | Compact EV Crossover | 5 | RWD / e-AWD | SE, SEL, Limited |\n| **IONIQ 6** | Mid-size EV Sedan | 5 | RWD / e-AWD | SE, SEL, Limited |\n| **IONIQ 9** | Full-size EV 3-Row SUV | 7 | e-AWD | SE, SEL, Limited, Calligraphy |\n\n## Key Feature Comparison\n\n| Feature | Elantra | Sonata | Tucson | Santa Fe | Palisade | IONIQ 5 | Kona |\n|---|---|---|---|---|---|---|---|\n| Base Engine | 2.0L 4-cyl | 2.5L 4-cyl | 2.5L 4-cyl | 2.5L 4-cyl | 3.8L V6 | Electric | 2.0L 4-cyl |\n| AWD Available | No | No | Yes | Yes | Yes | e-AWD | Yes |\n| 3rd Row | No | No | No | Optional | Yes | No | No |\n| SmartSense | Standard | Standard | Standard | Standard | Standard | Standard | Standard |\n| Wireless Apple CarPlay | Yes | Yes | Yes | Yes | Yes | Yes | Yes |\n| Wireless Android Auto | Yes | Yes | Yes | Yes | Yes | Yes | Yes |\n\n## Electric & Hybrid Options\n\n| Model | Type | Notes |\n|---|---|---|\n| **IONIQ 5** | Full EV | 800V fast charging, vehicle-to-load |\n| **IONIQ 6** | Full EV Sedan | Aerodynamic streamliner design |\n| **IONIQ 9** | Full EV 3-Row SUV | Flagship electric SUV |\n| **Santa Fe Hybrid** | Hybrid | Efficient mid-size SUV |\n\n## Current Financing Specials (expire 08/31/2026)\n\n| Model | APR Offer | Term |\n|---|---|---|\n| 2026 Santa Fe | 0% APR | 60 months |\n| 2026 Santa Fe Hybrid | 0% APR | 60 months |\n| 2026 Tucson | 0% APR | 60 months |\n| 2026 IONIQ 5 | 0% APR | 72 months |\n| 2026 IONIQ 9 | 0% APR | 72 months |\n| 2026 Sonata | 0.99% APR | 60 months |\n| 2026 Elantra | 3.49% APR | 60 months |\n| 2026 Kona | 3.49% APR | 60 months |\n| 2026 Palisade | 3.99% APR | 60 months |\n\n## Warranty\n\nAll new Hyundai models include:\n\n- **5-Year / 60,000-Mile New Vehicle Limited Warranty**\n- **10-Year / 100,000-Mile Powertrain Limited Warranty**\n- **7-Year / Unlimited-Mile Anti-Perforation Limited Warranty**\n- **5-Year / Unlimited-Mile Roadside Assistance**\n- **3-Year Complimentary Maintenance** (Hyundai Complimentary Maintenance on 2020-2025 model years)\n\n## Hyundai SmartSense Safety\n\nStandard across most Hyundai models:\n\n- Forward Collision-Avoidance Assist\n- Blind-Spot Collision-Avoidance Assist\n- Rear Cross-Traffic Collision-Avoidance Assist\n- Lane Keeping Assist\n- Lane Following Assist\n- Safe Exit Assist\n- Driver Attention Warning\n- Smart Cruise Control\n\nSee [new-vehicles.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/hyundai-montgomery/datasets/new-vehicles.md) for detailed model descriptions.\nSee [financing.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/hyundai-montgomery/datasets/financing.md) for current financing specials."

<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} - OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      { selector: "node", style: { "background-color": "data(color)", "label": "data(label)", "color": "#0f172a", "font-size": 11, "text-valign": "bottom", "text-margin-y": 4, "text-wrap": "wrap", "text-max-width": 120, "width": "data(size)", "height": "data(size)", "border-width": 1, "border-color": "#0f172a" } },
      { selector: "node:selected", style: { "border-width": 3, "border-color": "#f59e0b" } },
      { selector: "edge", style: { "width": 1.5, "line-color": "#cbd5e1", "target-arrow-color": "#cbd5e1", "target-arrow-shape": "triangle", "curve-style": "bezier", "arrow-scale": 0.9 } },
      { selector: "edge:selected", style: { "line-color": "#f59e0b", "target-arrow-color": "#f59e0b", "width": 2.5 } },
      { selector: ".dim", style: { "opacity": 0.15 } },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => { if (evt.target === cy) clearSelection(); });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) { cy.elements().removeClass("dim"); return; }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay = (d.label || "").toLowerCase() + " " + d.id.toLowerCase() + " " + (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) { cy.elements().removeClass("dim"); return; }
    cy.nodes().forEach((n) => { n.toggleClass("dim", n.data("type") !== t); });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    document.getElementById("detail").scrollTop = 0;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "-";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "-";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "-";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl, conceptId);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = (nodeIndex[src]?.label || src).replace(/—/g, '-');
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }
  }

  function rewriteInternalLinks(root, sourceConceptId) {
    const sourceDir = sourceConceptId ? sourceConceptId.substring(0, sourceConceptId.lastIndexOf("/")) : "";
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.endsWith(".md") && !href.startsWith("http")) {
        let target = href.startsWith("/") ? href.slice(1) : href;
        target = target.slice(0, -3);
        if (!nodeIndex[target] && sourceDir && !target.includes("/")) {
          target = sourceDir + "/" + target;
        }
        if (nodeIndex[target]) {
          a.className = "internal";
          a.textContent = nodeIndex[target].label.replace(/—/g, '-');
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => { e.preventDefault(); showDetail(target); });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  const initial = bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();
</script>
