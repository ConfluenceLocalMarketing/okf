    "datasets/faq": "# Frequently Asked Questions\n\nCommon questions about the dealership, custom factory orders and the buying process at Mullinax Ford of Kissimmee.\n\n## Custom Factory Order FAQ\n\n### How long does a custom factory order take?\n\nLead times vary by model and configuration. The sales team provides a delivery estimate when the order is placed.\n\n### Does Ford charge extra for a custom factory order?\n\nFord does not charge extra for customer-ordered vehicles. Pricing follows the same Up Front Pricing model.\n\n### Can I use incentives on a factory order?\n\nIncentives can be applied at order placement or at final delivery, whichever the customer prefers, subject to current program rules.\n\n### How do I track my ordered vehicle?\n\nOnce a VIN is assigned, the vehicle can be tracked at [shop.ford.com/vehicleordertracking](https://www.ford.com/help/buying/vehicle-ordering/). The dealership contacts the customer when the vehicle arrives.\n\n## Dealership FAQ\n\n### Is there a dealer fee?\n\nNo. Mullinax Ford of Kissimmee charges a $0 dealer fee. The advertised price is the price you pay.\n\n### Does the dealership negotiate?\n\nNo. The dealership uses Up Front Pricing, a no-haggle model where the sticker price is the final price.\n\n### What does the dealership service?\n\nThe service center handles all Ford makes and models, and Quick Lane services all vehicle makes and models.\n\n### What areas does the dealership serve?\n\nThe dealership serves Kissimmee, Poinciana, South Orlando and St. Cloud.\n\n## Related Concepts\n\n- See [mullinax-ford-of-kissimmee.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/datasets/mullinax-ford-of-kissimmee.md) for the dealership profile.\n- See [financing.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/datasets/financing.md) for financing details.",

    "datasets/mullinax-ford-of-kissimmee": "# Mullinax Ford of Kissimmee\n\nMullinax Ford of Kissimmee is a Ford dealership located at 1810 E Irlo Bronson Memorial Hwy, Kissimmee, FL 34744, serving Kissimmee, Poinciana, South Orlando and St. Cloud. The dealership is part of the Mullinax Automotive family of no-haggle Ford stores.\n\n## At a Glance\n\n- Rating: 4.7 / 5 based on 3,356 reviews\n- Categories: Ford dealer, Car dealer, Truck dealer, Used car dealer, Used truck dealer, Car leasing service, Motor vehicle dealer, Car finance and loan company\n- Services: New car sales, New truck sales, Used car sales, Used truck sales, Auto financing, New car leasing\n- Inventory: 3,534 vehicles shown on the homepage (2,246 new / 1,288 used)\n- Certified Pre-Owned: 914 vehicles in the CPO program\n- Pricing: Up Front Pricing where the price you see is the price you pay\n\n## Location\n\n| Detail | Value |\n|---|---|\n| Address | 1810 E Irlo Bronson Memorial Hwy, Kissimmee, FL 34744 |\n| Coordinates | 28.2964668, -81.37191 |\n| Area Served | Kissimmee, Poinciana, South Orlando, St. Cloud |\n\n## Up Front Pricing\n\nMullinax Ford of Kissimmee uses Up Front Pricing. The sticker price shown is the price you pay, with no dealer fees and no negotiation required. The dealership highlights a $0 dealer fee, meaning the advertised price is not padded with doc fees, dealer markup or accessories.\n\n## Contact\n\n| Department | Phone |\n|---|---|\n| Main | 407-972-1640 |\n| Sales | 407-904-2981 |\n| Service | 407-904-5562 |\n| Parts | 407-904-2451 |\n| Quick Lane | 407-904-2985 |\n\n## Services\n\n- New and used vehicle sales for all Ford models\n- Ford Certified Pre-Owned program\n- Factory-trained service technicians and genuine Ford parts\n- Quick Lane tire and auto center\n- Financing and leasing through Ford Credit and partner lenders\n- Custom factory-order placement for retail customers\n\n## Related Concepts\n\n- See [new-vehicles.md](https://promptgraph.nyc3.cdn.digitaloceanspa     "datasets/new-vehicles": "# New Vehicles\n\nMullinax Ford of Kissimmee maintains a new vehicle inventory shown on the dealership website. The homepage inventory counter displayed 3,534 total vehicles, with 2,246 new and 1,288 used vehicles.\n\n## New Vehicle Lines\n\n- Trucks: F-150, F-150 Lightning, Super Duty (F-250 / F-350), F-650 / F-750, Maverick, Ranger\n- SUVs: Bronco, Bronco Sport, Edge, Escape, Expedition, Expedition MAX, Explorer\n- Cars: Mustang, Mustang Mach-E\n- Commercial vans: E-Transit, Transit, Transit Connect, E-Series cutaway, E-Series stripped chassis\n- EV and hybrid: Mustang Mach-E, F-150 Lightning, E-Transit, Escape Hybrid, Escape Plug-In Hybrid, Explorer Hybrid\n\n## Model Categories\n\n| Category | Models |\n|---|---|\n| Trucks | F-150, F-150 Lightning, Super Duty, F-650, F-750, Maverick, Ranger |\n| SUVs / Crossovers | Bronco, Bronco Sport, Edge, Escape, Expedition, Explorer |\n| Cars | Mustang, Mustang Mach-E |\n| Commercial Vans | Transit, Transit Connect, E-Transit, E-Series |\n| Chassis Cabs | Super Duty Chassis Cab |\n\n## Inventory Facts\n\n- Homepage inventory counter: 3,534 total vehicles (2,246 new / 1,288 used)\n- New vehicle specials available at [new-vehicle-specials](https://www.mullinaxfordkiss.com/new-vehicles/new-vehicle-specials/)\n- Hot Buys listing at [new-vehicle-specials-3](https://www.mullinaxfordkiss.com/new-vehicles/new-vehicle-specials-3/)\n- Vehicles are subject to prior sale; price does not include tax, title and license charges\n\n## Buying\n\n- Up Front Pricing with no dealer fees\n- Factory order a new Ford if the desired configuration is not in stock\n- Schedule a test drive through the dealership website\n- Apply for financing online at [apply-for-financing](https://www.mullinaxfordkiss.com/finance/apply-for-financing/)\n\n## Related Concepts\n\n- See [mullinax-ford-of-kissimmee.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/datasets/mullinax-ford-of-kissimmee.md) f     "datasets/service-center": "# Service Center and Quick Lane\n\nMullinax Ford of Kissimmee operates a full service center staffed by factory-trained technicians using genuine Ford parts, plus a Quick Lane Tire and Auto Center for fast maintenance on all makes and models.\n\n## Service Center\n\n- Factory-trained Ford technicians\n- Genuine Ford and Motorcraft parts\n- Services for Ford owners can be scheduled at [schedule-service](https://www.mullinaxfordkiss.com/service/schedule-service/)\n- Service coupons and specials at [service-specials](https://www.mullinaxfordkiss.com/service/service-specials/)\n\n## Quick Lane Tire and Auto Center\n\nQuick Lane at Mullinax Ford Kissimmee provides maintenance and repair services for all vehicle makes and models, with 8 service bays.\n\n### Quick Lane Services\n\n- Synthetic and synthetic blend oil changes with oil filter replacement\n- Battery testing, charging and new battery installation\n- Tire rotation and balancing, flat tire repairs and new tire installation\n- Brake pad replacement, rotor and caliper repair, brake line repair\n- Air filter replacement\n- Windshield wiper replacement\n- Belt and hose replacement\n- Wheel alignment\n- Spark plug replacement\n- Electrical repair\n\n### Quick Lane Highlights\n\n- 8 service bays for faster service\n- Speed and timing\n- Low tire price guarantee\n- Genuine Motorcraft parts\n- Lifetime warranty on brakes\n- Services all makes and models\n- Comfortable waiting area with refreshments and free WiFi\n\n### Service Facts\n\n- Oil changes generally recommended every 5,000 to 10,000 miles depending on vehicle\n- Tires can last 30,000 to 60,000 miles; replace when tread wears to 3/32 inch (2.4 mm) or less\n- Brakes can last 30,000 to 60,000 miles; brake pad replacement roughly $190 per axle\n- Typical car battery capacity is 12.6 volts with 300 to 760 CCA; in Florida batteries typically last two to three years\n\n## Hours\n\n| Day | Quick Lane | Parts |\n|---|---|---|\n| Monday - Friday | 7:00 AM - 7:00 PM | 7:30 AM - 5:30 PM |\n| Saturday | 8:00 AM - 5:00 PM | 8:00 AM - 3:00 PM |\n| Sunday | Closed | Closed |\n\n## Related Concepts\n\n- See [mullinax-ford-of-kissimmee.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/datasets/mullinax-ford-of-kissimmee.md) for the dealership profile.\n- See [hours.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/tables/hours.md) for department hours.\n- See [contact.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/tables/contact.md) for service phone numbers.",

    "datasets/used-vehicles": "# Used Vehicles\n\nMullinax Ford of Kissimmee sells used vehicles of all makes and models alongside its new Ford inventory. The homepage inventory counter displayed 1,288 used vehicles out of 3,534 total.\n\n## Used Inventory\n\n- 1,288 used vehicles listed on the homepage inventory counter\n- Used vehicles include Fords as well as other makes and models\n- Dedicated listings: Vehicles Under 10K at [priced-under-10k](https://www.mullinaxfordkiss.com/used-vehicles/priced-under-10k/)\n- Used vehicles are subject to prior sale\n\n## Ford Certified Pre-Owned\n\n- 914 Certified Pre-Owned Ford vehicles listed\n- Program page: [certified-pre-owned-vehicles](https://www.mullinaxfordkiss.com/used-vehicles/certified-pre-owned-vehicles/)\n- Ford CPO vehicles are inspected and covered by the Ford Blue Advantage limited warranty program\n\n## Buying\n\n- Up Front Pricing with no dealer fees\n- Trade-in valuation available on the dealership website\n- Financing and pre-approval through the [financing page](https://www.mullinaxfordkiss.com/finance/)\n- Schedule a test drive online\n\n## Related Concepts\n\n- See [mullinax-ford-of-kissimmee.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/datasets/mullinax-ford-of-kissimmee.md) for the dealership profile.\n- See [new-vehicles.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/datasets/new-vehicles.md) for the new vehicle inventory.\n- See [financing.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/datasets/financing.md) for financing and pre-approval.",
    "references/ai-discovery-page": "# AI Discovery Page\n\nMullinax Ford of Kissimmee exposes an AI discovery layer built on PromptGraph. The discovery endpoints publish dealership knowledge as Schema.org JSON-LD for LLM ingestion and consumer AI assistants.\n\n## API Overview\n\n- Title: Mullinax Ford of Kissimmee | Dealership API\n- Version: 1.0.0\n- Contact: support@promptgraph.ai\n- Base URL: https://app.promptgraph.ai/api/v1/mullinax-ford-of-kissimmee\n- Format: Schema.org JSON-LD\n\n## Discovery Endpoints\n\n| Endpoint | Description |\n|---|---|\n| /openapi.json | OpenAPI specification for the dealership API |\n| /config.json | Dealership configuration |\n| /ai-plugin.json | AI plugin manifest |\n| /.well-known/ai-manifest.json | AI manifest for the dealership |\n| /llms.txt | LLM-friendly text index of dealership knowledge |\n| /robots.txt | Robots directives for AI crawlers |\n| /sitemap.xml | Sitemap of dealership knowledge endpoints |\n\n## Data Endpoints\n\n| Endpoint | Description |\n|---|---|\n| /business | Dealership business profile as JSON-LD |\n| /testimonials | Customer testimonials |\n| /prompts | Suggested user prompts with landing pages |\n| /vehicles | Vehicle inventory |\n| /vehicles/{vin} | Single vehicle by VIN |\n| /sitemap-inventory.xml | Inventory sitemap |\n\n## Related Concepts\n\n- See [llms-txt.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/references/llms-txt.md) for the llms.txt discovery index.\n- See [prompts.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/references/prompts.md) for the suggested prompts.\n- See [mullinax-ford-of-kissimmee.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/datasets/mullinax-ford-of-kissimmee.md) for the dealership profile.",

    "references/testimonials": "# Customer Reviews & Testimonials - Mullinax Ford of Kissimmee\n\n## Overview\n\nMullinax Ford of Kissimmee maintains a strong online reputation. Aggregate ratings are published via the Google Business Profile; an AI-readable testimonials feed is exposed through PromptGraph.\n\n## Aggregate Rating\n\n- **Rating**: 4.7 / 5\n- **Review count**: 3,356 Google reviews\n- **Source**: Google Business Profile AggregateRating (via PromptGraph /business)\n\n## Testimonials Endpoint\n\n- **Endpoint**: `https://api.promptgraph.ai/api/v1/mullinax-ford-of-kissimmee/testimonials`\n- **Status**: Returns an empty array as of 2026-08-06.\n- Because the feed is empty, no individual testimonial text is reproduced in this bundle (no fabrication).\n\n## Review Pages\n\n- Cars.com dealer profile: https://www.cars.com/dealers/147265/mullinax-ford-of-kissimmee/\n- DealerRater profile: https://www.dealerrater.com/dealer/Mullinax-Ford-of-Kissimmee-review-5677/\n- Facebook: https://www.facebook.com/MullinaxFordKISS\n- YouTube: https://www.youtube.com/@mullinaxford7771\n\n## Related Concepts\n\n- See [mullinax-ford-of-kissimmee.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/datasets/mullinax-ford-of-kissimmee.md) for the dealership profile and rating summary.\n- See [ai-discovery-page.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/references/ai-discovery-page.md) for the testimonials endpoint status.\n- See [prompts.md](https://promptgraph.nyc3.cdn.digitaloceanspaces.com/OKF/mullinax-ford-of-kissimmee/references/prompts.md) for prompt #19 (Top Ford Dealer Reputation).",

<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} - OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      { selector: "node", style: { "background-color": "data(color)", "label": "data(label)", "color": "#0f172a", "font-size": 11, "text-valign": "bottom", "text-margin-y": 4, "text-wrap": "wrap", "text-max-width": 120, "width": "data(size)", "height": "data(size)", "border-width": 1, "border-color": "#0f172a" } },
      { selector: "node:selected", style: { "border-width": 3, "border-color": "#f59e0b" } },
      { selector: "edge", style: { "width": 1.5, "line-color": "#cbd5e1", "target-arrow-color": "#cbd5e1", "target-arrow-shape": "triangle", "curve-style": "bezier", "arrow-scale": 0.9 } },
      { selector: "edge:selected", style: { "line-color": "#f59e0b", "target-arrow-color": "#f59e0b", "width": 2.5 } },
      { selector: ".dim", style: { "opacity": 0.15 } },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => { if (evt.target === cy) clearSelection(); });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) { cy.elements().removeClass("dim"); return; }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay = (d.label || "").toLowerCase() + " " + d.id.toLowerCase() + " " + (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) { cy.elements().removeClass("dim"); return; }
    cy.nodes().forEach((n) => { n.toggleClass("dim", n.data("type") !== t); });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    document.getElementById("detail").scrollTop = 0;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "-";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "-";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "-";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl, conceptId);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = (nodeIndex[src]?.label || src).replace(/—/g, '-');
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }
  }

  function rewriteInternalLinks(root, sourceConceptId) {
    const sourceDir = sourceConceptId ? sourceConceptId.substring(0, sourceConceptId.lastIndexOf("/")) : "";
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.endsWith(".md") && !href.startsWith("http")) {
        let target = href.startsWith("/") ? href.slice(1) : href;
        target = target.slice(0, -3);
        if (!nodeIndex[target] && sourceDir && !target.includes("/")) {
          target = sourceDir + "/" + target;
        }
        if (nodeIndex[target]) {
          a.className = "internal";
          a.textContent = nodeIndex[target].label.replace(/—/g, '-');
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => { e.preventDefault(); showDetail(target); });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  const initial = bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();
</script>
